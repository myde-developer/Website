<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3 Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf6f0; }

        .admin-panel { display: flex !important; flex-direction: column; height: 100vh; background: #faf6f0; }
        .admin-header { background: white; padding: 16px 32px; border-bottom: 1px solid #e8e0da; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .admin-header h2 { font-family: 'Playfair Display', serif; font-size: 22px; }
        .admin-header h2 span { color: #c9a84c; }
        .admin-header .back-link { color: #8a7e7a; text-decoration: none; font-size: 14px; }
        .admin-header .back-link:hover { color: #c9a84c; }
        .admin-header .close-admin { background: none; border: none; font-size: 20px; color: #8a7e7a; cursor: pointer; }
        .admin-header .close-admin:hover { color: #1a1410; }

        .admin-lang-currency { display: flex; align-items: center; gap: 8px; }
        .admin-lang-currency select { background: transparent; border: 1px solid #e8e0da; border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #8a7e7a; cursor: pointer; }
        .admin-lang-currency select:hover { border-color: #c9a84c; color: #a8892e; }

        .admin-body { display: flex; flex: 1; overflow: hidden; }
        .admin-sidebar { width: 240px; background: white; border-right: 1px solid #e8e0da; padding: 20px 0; flex-shrink: 0; overflow-y: auto; }
        .admin-sidebar .menu-item { padding: 12px 24px; font-size: 14px; font-weight: 500; color: #2c241e; cursor: pointer; display: flex; align-items: center; gap: 12px; border-left: 3px solid transparent; transition: all 0.3s; }
        .admin-sidebar .menu-item:hover { background: rgba(201,168,76,0.04); color: #a8892e; }
        .admin-sidebar .menu-item.active { background: rgba(201,168,76,0.08); color: #a8892e; border-left-color: #c9a84c; }

        .admin-content { flex: 1; padding: 32px; overflow-y: auto; }

        .admin-login { display: flex; align-items: center; justify-content: center; height: 100%; background: #faf6f0; }
        .admin-login-box { background: white; padding: 48px; border-radius: 16px; box-shadow: 0 16px 48px rgba(26,20,16,0.20); max-width: 400px; width: 100%; text-align: center; }
        .admin-login-box h3 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 4px; }
        .admin-login-box .sub { color: #8a7e7a; font-size: 14px; margin-bottom: 24px; }
        .admin-login-box input { width: 100%; padding: 12px 16px; border: 1px solid #e8e0da; border-radius: 8px; margin-bottom: 12px; background: #faf6f0; font-size: 14px; }
        .admin-login-box .login-btn { width: 100%; padding: 12px; background: #c9a84c; color: white; border: none; border-radius: 50px; font-weight: 600; font-size: 15px; cursor: pointer; }
        .admin-login-box .login-btn:hover { background: #a8892e; }

        .admin-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .admin-stat { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 32px rgba(26,20,16,0.12); }
        .admin-stat .number { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #a8892e; }
        .admin-stat .label { font-size: 13px; color: #8a7e7a; margin-top: 4px; }

        .admin-table-wrap { background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(26,20,16,0.12); overflow: hidden; }
        .admin-table-wrap .table-header { padding: 16px 24px; border-bottom: 1px solid #e8e0da; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .admin-table-wrap .table-header h4 { font-weight: 600; }
        .admin-table-wrap .table-header .add-btn { background: #c9a84c; color: white; padding: 8px 20px; border: none; border-radius: 50px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .admin-table-wrap .table-header .add-btn:hover { background: #a8892e; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th { text-align: left; padding: 12px 16px; background: #faf6f0; font-weight: 600; color: #2c241e; border-bottom: 1px solid #e8e0da; }
        .admin-table td { padding: 12px 16px; border-bottom: 1px solid #e8e0da; vertical-align: middle; }
        .admin-table .actions { display: flex; gap: 8px; }
        .admin-table .actions button { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .admin-table .actions .edit-btn { background: rgba(201,168,76,0.12); color: #a8892e; }
        .admin-table .actions .edit-btn:hover { background: #c9a84c; color: white; }
        .admin-table .actions .del-btn { background: rgba(231,76,60,0.08); color: #c0392b; }
        .admin-table .actions .del-btn:hover { background: #e74c3c; color: white; }
        .admin-table .badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(201,168,76,0.12); color: #a8892e; }

        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 14px 24px; background: #1a1410; color: white; border-radius: 8px; box-shadow: 0 16px 48px rgba(26,20,16,0.20); font-size: 14px; font-weight: 500; animation: slideUp 0.4s ease; display: flex; align-items: center; gap: 12px; min-width: 240px; border-left: 4px solid #c9a84c; }
        .toast.success { border-left-color: #4caf50; }
        .toast.error { border-left-color: #e74c3c; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* ============================================
           🔥 FULL PAGE MODAL - GUARANTEED TO SHOW
           ============================================ */
        .modal-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            z-index: 999999 !important;
            display: none !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 20px !important;
            margin: 0 !important;
            position: fixed !important;
        }
        .modal-overlay.open {
            display: flex !important;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            animation: modalIn 0.4s ease;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }
        @keyframes modalIn {
            from { transform: scale(0.8) translateY(40px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-content .close-modal {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            color: #8a7e7a;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px;
            z-index: 10;
        }
        .modal-content .close-modal:hover {
            color: #1a1410;
            transform: rotate(90deg);
        }
        .modal-content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 20px;
            color: #1a1410;
            clear: both;
        }
        .modal-content .form-group {
            margin-bottom: 18px;
        }
        .modal-content .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            color: #2c241e;
        }
        .modal-content .form-group input,
        .modal-content .form-group select,
        .modal-content .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e8e0da;
            border-radius: 8px;
            background: #faf6f0;
            font-size: 14px;
            transition: all 0.3s;
        }
        .modal-content .form-group input:focus,
        .modal-content .form-group select:focus,
        .modal-content .form-group textarea:focus {
            border-color: #c9a84c;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
            outline: none;
        }
        .modal-content .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-content .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .modal-content .btn-primary {
            background: #c9a84c;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-content .btn-primary:hover {
            background: #a8892e;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201,168,76,0.3);
        }
        .modal-content .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .modal-content .btn-secondary {
            background: #e8e0da;
            color: #2c241e;
            border: none;
            padding: 14px 34px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .modal-content .btn-secondary:hover {
            background: #d5cdc5;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .modal-actions .btn-primary {
            flex: 1;
        }

        .image-upload-container {
            border: 2px dashed #e8e0da;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-upload-container:hover {
            border-color: #c9a84c;
            background: rgba(201,168,76,0.04);
        }
        .image-upload-container img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin: 10px auto;
            display: block;
        }
        .image-upload-container .placeholder-text {
            color: #8a7e7a;
            font-size: 14px;
        }
        .image-upload-container .placeholder-text i {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
            color: #e8e0da;
        }
        .image-upload-container input[type="file"] {
            display: none;
        }
        .image-upload-container .remove-image {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,0,0,0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .image-upload-container.has-image .remove-image {
            display: flex;
        }
        .image-upload-container .upload-progress {
            display: none;
            margin-top: 10px;
            width: 100%;
        }
        .image-upload-container .upload-progress.active {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e8e0da;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: #c9a84c;
            width: 0%;
            transition: width 0.3s ease;
        }
        .upload-status {
            font-size: 12px;
            color: #8a7e7a;
            margin-top: 4px;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 8px 16px;
            border: 1px solid #e8e0da;
            border-radius: 8px;
            background: #faf6f0;
            font-size: 14px;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: #c9a84c;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
            outline: none;
        }

        @media (max-width: 768px) {
            .admin-sidebar { width: 60px; }
            .admin-sidebar .menu-item span { display: none; }
            .admin-sidebar .menu-item { justify-content: center; padding: 16px; }
            .admin-content { padding: 16px; }
            .admin-stats { grid-template-columns: 1fr 1fr; }
            .modal-content { padding: 24px; margin: 10px; max-height: 95vh; }
            .modal-content .form-row { grid-template-columns: 1fr; }
            .admin-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .admin-header h2 { font-size: 16px; }
            .admin-table { font-size: 12px; }
            .admin-table th, .admin-table td { padding: 8px 10px; }
            .modal-actions { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .admin-header h2 { font-size: 14px; }
            .admin-lang-currency select { font-size: 10px; padding: 2px 6px; }
            .admin-table-wrap .table-header .add-btn { font-size: 11px; padding: 6px 12px; }
            .modal-content { padding: 16px; }
            .modal-content h3 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h2><i class="fas fa-crown" style="color:#c9a84c;"></i> A3<span style="color:#c9a84c;">Glam & Fashion</span> <span style="font-size:14px;color:#8a7e7a;font-weight:400;">| แผงควบคุม</span></h2>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                <div class="admin-lang-currency">
                    <select id="adminLangSelect">
                        <option value="th">ไทย</option>
                        <option value="en">EN</option>
                    </select>
                    <span style="color:#e8e0da;">|</span>
                    <select id="adminCurrencySelect">
                        <option value="thb">฿</option>
                        <option value="usd">$</option>
                    </select>
                </div>
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> กลับหน้าร้าน</a>
                <button class="close-admin" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div class="admin-body">
            <nav class="admin-sidebar" id="adminSidebar">
                <div class="menu-item active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></div>
                <div class="menu-item" data-tab="products"><i class="fas fa-box"></i> <span>สินค้า</span></div>
                <div class="menu-item" data-tab="categories"><i class="fas fa-tags"></i> <span>หมวดหมู่</span></div>
                <div class="menu-item" data-tab="orders"><i class="fas fa-receipt"></i> <span>คำสั่งซื้อ</span></div>
            </nav>
            <div class="admin-content" id="adminContent">
                <!-- Content rendered by admin.js -->
            </div>
        </div>
    </div>

    <!-- ============================================
    🔥 FULL PAGE MODAL - COVERS EVERYTHING
    ============================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="close-modal" id="modalCloseBtn"><i class="fas fa-times"></i></button>
            <h3 id="modalTitle">เพิ่มสินค้า</h3>
            <form id="modalForm">
                <div id="modalBody"></div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary" id="modalSubmitBtn">
                        <i class="fas fa-save"></i> บันทึก
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
</script>
</body>
</html>
